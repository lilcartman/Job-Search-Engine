<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowork — pipeline console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eff2ec;
    --surface: #ffffff;
    --ink: #14231c;
    --muted: #5f6e63;
    --line: #d9e0d5;
    --accent: #0e7c5b;
    --pulse: #19c685;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Archivo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
  }

  /* ---- sync ticker ---- */
  .ticker {
    background: var(--ink);
    color: #e9f2ec;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 9px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .ticker .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pulse);
    animation: pulse 2.4s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) { .ticker .dot { animation: none } }
  .ticker .sep { color: #5c6f63; }
  .ticker b { color: var(--pulse); font-weight: 500; }

  /* ---- frame ---- */
  header.page {
    padding: 26px 20px 14px;
    max-width: 1200px; margin: 0 auto;
  }
  header.page h1 {
    margin: 0;
    font-size: 21px; font-weight: 700; letter-spacing: -0.015em;
  }
  header.page p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

  .layout {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: 220px 1fr;
    gap: 20px; padding: 0 20px 40px;
  }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  /* ---- table list ---- */
  nav.tables { display: flex; flex-direction: column; gap: 6px; align-self: start; }
  @media (max-width: 760px) { nav.tables { flex-direction: row; flex-wrap: wrap; } }
  nav.tables button {
    font: inherit; text-align: left;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 9px 12px;
    background: transparent; color: var(--ink);
    border: 1px solid transparent; border-radius: 6px;
    cursor: pointer;
  }
  nav.tables button:hover { border-color: var(--line); background: var(--surface); }
  nav.tables button.active {
    background: var(--surface); border-color: var(--line);
    border-left: 3px solid var(--accent);
  }
  nav.tables .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* ---- main panel ---- */
  main { min-width: 0; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar h2 {
    margin: 0; font-size: 16px; font-weight: 600;
    font-family: var(--mono); letter-spacing: -0.01em;
  }
  .toolbar .total { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
  .toolbar input {
    margin-left: auto;
    font: 13.5px var(--sans);
    padding: 8px 12px; width: 230px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .grid-wrap {
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--accent); }
  th .arrow { color: var(--accent); }
  td {
    padding: 9px 14px; border-bottom: 1px solid var(--line);
    white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis;
    vertical-align: baseline;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f6f8f4; }
  td.num { font-family: var(--mono); font-size: 12.5px; }
  td a { color: var(--accent); }
  td .null { color: var(--muted); opacity: .6; }

  .pager {
    display: flex; gap: 10px; align-items: center;
    margin-top: 12px; font-family: var(--mono); font-size: 12.5px; color: var(--muted);
  }
  .pager button {
    font: 12.5px var(--mono);
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: default; }

  .empty {
    padding: 42px 20px; text-align: center; color: var(--muted); font-size: 14px;
  }
  .error {
    background: #fdf1ef; border: 1px solid #edcac2; color: #7a2e1d;
    border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; font-size: 13.5px;
  }
</style>
</head>
<body>

<div class="ticker" id="ticker">
  <span class="dot"></span><span>connecting to database…</span>
</div>

<header class="page">
  <h1>Cowork pipeline console</h1>
  <p>Read-only view of the Neon database behind the job-search pipeline.</p>
</header>

<div class="layout">
  <nav class="tables" id="tables" aria-label="Tables"></nav>
  <main>
    <div id="error"></div>
    <div class="toolbar">
      <h2 id="tableName">—</h2>
      <span class="total" id="total"></span>
      <input id="search" type="search" placeholder="Search text columns…" aria-label="Search rows">
    </div>
    <div class="grid-wrap"><table id="grid"></table><div class="empty" id="empty" hidden>No rows match.</div></div>
    <div class="pager">
      <button id="prev">‹ Prev</button>
      <span id="pageInfo"></span>
      <button id="next">Next ›</button>
    </div>
  </main>
</div>

<script>
const state = { table: null, page: 1, search: "", sort: "", dir: "asc", total: 0 };
const $ = id => document.getElementById(id);

const fmt = new Intl.NumberFormat();

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

function showError(msg) {
  $("error").innerHTML = msg
    ? `<div class="error">${msg} — check that the server is running and DATABASE_URL is set.</div>` : "";
}

function renderTicker(sync) {
  const t = $("ticker");
  if (!sync) {
    t.innerHTML = `<span class="dot"></span><span>connected</span><span class="sep">·</span><span>no sync_log table found</span>`;
    return;
  }
  const parts = Object.entries(sync)
    .filter(([k]) => k !== "id")
    .map(([k, v]) => `${k.replace(/_/g, " ")} <b>${v ?? "—"}</b>`);
  t.innerHTML = `<span class="dot"></span><span>last sync</span><span class="sep">·</span>` +
    parts.join(`<span class="sep">·</span>`);
}

function renderTables(tables) {
  $("tables").innerHTML = tables.map(t =>
    `<button data-t="${t.name}" class="${t.name === state.table ? "active" : ""}">
       <span>${t.name}</span><span class="count">${fmt.format(t.rows)}</span>
     </button>`).join("");
  document.querySelectorAll("nav.tables button").forEach(b =>
    b.onclick = () => { state.table = b.dataset.t; state.page = 1; state.sort = ""; loadTable(); refreshNav(); });
}

function refreshNav() {
  document.querySelectorAll("nav.tables button").forEach(b =>
    b.classList.toggle("active", b.dataset.t === state.table));
}

function cell(v) {
  if (v === null || v === undefined) return `<span class="null">∅</span>`;
  if (typeof v === "string" && /^https?:\/\//.test(v))
    return `<a href="${v}" target="_blank" rel="noopener">${new URL(v).hostname}</a>`;
  if (v === true) return "✓";
  if (v === false) return "✗";
  return String(v).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
}

async function loadTable() {
  if (!state.table) return;
  try {
    const q = new URLSearchParams({ page: state.page, search: state.search, sort: state.sort, dir: state.dir });
    const d = await api(`/api/table/${state.table}?` + q);
    state.total = d.total;
    $("tableName").textContent = state.table;
    $("total").textContent = fmt.format(d.total) + " rows";
    const arrow = state.dir === "asc" ? "↑" : "↓";
    $("grid").innerHTML =
      `<thead><tr>` + d.columns.map(c =>
        `<th data-c="${c}">${c}${state.sort === c ? ` <span class="arrow">${arrow}</span>` : ""}</th>`).join("") +
      `</tr></thead><tbody>` +
      d.rows.map(r => `<tr>` + d.columns.map(c => {
        const v = r[c];
        const num = typeof v === "number" || (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v));
        return `<td class="${num ? "num" : ""}">${cell(v)}</td>`;
      }).join("") + `</tr>`).join("") + `</tbody>`;
    $("empty").hidden = d.rows.length > 0;
    document.querySelectorAll("th").forEach(th => th.onclick = () => {
      const c = th.dataset.c;
      state.dir = state.sort === c && state.dir === "asc" ? "desc" : "asc";
      state.sort = c; state.page = 1; loadTable();
    });
    const pages = Math.max(1, Math.ceil(d.total / d.per_page));
    $("pageInfo").textContent = `page ${d.page} / ${pages}`;
    $("prev").disabled = d.page <= 1;
    $("next").disabled = d.page >= pages;
    showError("");
  } catch (e) { showError(e.message); }
}

$("prev").onclick = () => { state.page--; loadTable(); };
$("next").onclick = () => { state.page++; loadTable(); };
let debounce;
$("search").oninput = e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.search = e.target.value; state.page = 1; loadTable(); }, 300);
};

(async function init() {
  try {
    const d = await api("/api/overview");
    renderTicker(d.last_sync);
    renderTables(d.tables);
    if (d.tables.length) {
      const preferred = d.tables.find(t => t.name === "jobs") || d.tables[0];
      state.table = preferred.name;
      refreshNav();
      loadTable();
    } else {
      $("tableName").textContent = "no tables yet";
    }
  } catch (e) { showError(e.message); }
})();
</script>
</body>
</html>
